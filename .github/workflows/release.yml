name: Release

# Ships a new version whenever package.json's version changes on main
# (e.g. `npm run release:patch`), or when a v* tag is pushed. It builds the
# Windows installer and publishes it to GitHub Releases; installed copies of
# Gridline pick it up automatically through the built-in updater.
# If a release for the current version already exists, the run is a no-op.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Is this version already released?
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$v" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version v$v"
            exit 1
          fi
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$v is already released — nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.ver.outputs.skip == 'false'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.ver.outputs.skip == 'false'
        run: npm ci

      - name: Test
        if: steps.ver.outputs.skip == 'false'
        run: npm test

      - name: Build installer and publish release
        if: steps.ver.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --x64 --publish always

      - name: Add stable-named installer (for a permanent download link)
        if: steps.ver.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          v="${{ steps.ver.outputs.version }}"
          cp "dist/Gridline-Setup-$v.exe" "dist/Gridline-Setup.exe"
          gh release upload "v$v" "dist/Gridline-Setup.exe" --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "v$v" --title "Gridline $v" --latest --repo "$GITHUB_REPOSITORY"

      - uses: actions/upload-artifact@v4
        if: steps.ver.outputs.skip == 'false'
        with:
          name: Gridline-Setup
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: error
