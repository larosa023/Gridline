name: Release

# Ships a new version whenever package.json's version changes on main
# (e.g. `npm run release:patch`), or when a v* tag is pushed. It builds the
# Windows installer and publishes it to GitHub Releases; installed copies of
# Gridline pick it up automatically through the built-in updater.
# If a release for the current version already exists, the run is a no-op.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Is this version already released?
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$v" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version v$v"
            exit 1
          fi
          # Released = the release exists AND carries latest.yml (what the updater reads).
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx latest.yml; then
            echo "v$v is already released — nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        if: steps.ver.outputs.skip == 'false'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.ver.outputs.skip == 'false'
        run: npm ci

      - name: Test
        if: steps.ver.outputs.skip == 'false'
        run: npm test

      - name: Build installer
        if: steps.ver.outputs.skip == 'false'
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Publish GitHub release
        if: steps.ver.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          v="${{ steps.ver.outputs.version }}"
          cd dist
          ls -la
          for f in "Gridline-Setup-$v.exe" "Gridline-Setup-$v.exe.blockmap" latest.yml; do
            [ -f "$f" ] || { echo "::error::Missing build output $f"; exit 1; }
          done
          cp "Gridline-Setup-$v.exe" Gridline-Setup.exe
          assets=("Gridline-Setup-$v.exe" "Gridline-Setup-$v.exe.blockmap" latest.yml Gridline-Setup.exe)
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "v$v" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "v$v" --title "Gridline $v" --draft=false --latest --repo "$GITHUB_REPOSITORY"
          else
            gh release create "v$v" "${assets[@]}" --title "Gridline $v" --target "$GITHUB_SHA" --generate-notes --latest --repo "$GITHUB_REPOSITORY"
          fi

      - uses: actions/upload-artifact@v4
        if: steps.ver.outputs.skip == 'false'
        with:
          name: Gridline-Setup
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: error
